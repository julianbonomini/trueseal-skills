name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A tag push must carry plugin.json at the same version (ADR-0005 lockstep).
  # The tag job below refuses the mismatch; promote.yml also checks before tagging.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and layout consistency
        run: scripts/check-version.sh

  tag-version:
    # Runs only on tag pushes (release flow); skipped on PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json version equals the tag
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#v}" scripts/check-version.sh

  reference-check:
    # G11 (docs ADR-0003/0005): every link and API name in the skills must exist.
    # The checker lives in trueseal-docs and resolves against that repo's built
    # site; the documented snippet pins a release tag, but no release exists yet,
    # so CI tracks trueseal-docs@main until 0.6.0 ships — the release flow then
    # flips both checkouts to the tag (documented in README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/checkout@v4
        with:
          repository: julianbonomini/trueseal-docs
          ref: main
          path: trueseal-docs
      - run: cd trueseal-docs && bun install --frozen-lockfile && bun run build
      - run: bun trueseal-docs/scripts/check-references.ts --ref main skills
